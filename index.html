<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>
        <p class="subtitle">Track your daily expenses easily</p>

        <form id="expenseForm">

            <label>Expense Name</label>
            <input type="text" id="expenseName" placeholder="e.g. Lunch" required>

            <label>Amount (₹)</label>
            <input type="number" id="expenseAmount" placeholder="e.g. 150" required>

            <label>Category</label>
            <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add Expense</button>

        </form>

        <div class="summary">
            <h2>Total Expenses</h2>
            <p>₹<span id="totalAmount">0</span></p>
        </div>

        <h2>Expense History</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
